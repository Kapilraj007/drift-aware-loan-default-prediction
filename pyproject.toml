[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-aware-loan-default"
version = "0.1.0"
description = "Reproducible, leakage-safe data foundation for drift-aware loan default research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Project contributors" }]
dependencies = [
  "celery[redis]==5.5.1",
  "fastapi==0.115.12",
  "joblib==1.4.2",
  "lightgbm==4.6.0",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "PyJWT==2.10.1",
  "pydantic-settings==2.8.1",
  "pwdlib[argon2]==0.2.1",
  "river==0.22.0",
  "scikit-learn==1.6.1",
  "shap==0.47.2",
  "SQLAlchemy==2.0.40",
  "xgboost==3.0.0",
]

[project.scripts]
drift-loan = "drift_loan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
