name: drift-loan

# Local Sprint 2 topology. The API image must contain the FastAPI application
# and worker modules; Compose deliberately overrides the Sprint 1 CLI entrypoint.
x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-loan_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-drift_loan}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
  TRAINING_QUEUE: ${TRAINING_QUEUE:-model-training}
  FEATURE_STORE_DIR: /data/feature_store
  MODEL_ARTIFACT_DIRECTORY: /models/current
  PREPROCESSOR_ARTIFACT_DIRECTORY: /models/preprocessor
  REPORTS_DIR: /reports
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drift_loan}
      POSTGRES_USER: ${POSTGRES_USER:-loan_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
    image: ${APP_IMAGE:-drift-loan-sprint2:local}
    restart: unless-stopped
    init: true
    entrypoint: []
    command:
      ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${FEATURE_STORE_HOST_PATH:-./data/processed/feature_store}
        target: /data/feature_store
        read_only: true
      - type: bind
        source: ${MODEL_ARTIFACT_HOST_PATH:-./data/artifacts/model}
        target: /models/current
        read_only: true
      - type: bind
        source: ${PREPROCESSOR_ARTIFACT_HOST_PATH:-./data/artifacts/preprocessor}
        target: /models/preprocessor
        read_only: true
      - type: bind
        source: ${REPORTS_HOST_PATH:-./reports/generated}
        target: /reports
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
    image: ${APP_IMAGE:-drift-loan-sprint2:local}
    restart: unless-stopped
    init: true
    profiles: ["queue"]
    entrypoint: []
    command: ["python", "-m", "backend.app.worker"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${FEATURE_STORE_HOST_PATH:-./data/processed/feature_store}
        target: /data/feature_store
        read_only: true
      - type: bind
        source: ${MODEL_ARTIFACT_HOST_PATH:-./data/artifacts/model}
        target: /models/current
      - type: bind
        source: ${PREPROCESSOR_ARTIFACT_HOST_PATH:-./data/artifacts/preprocessor}
        target: /models/preprocessor
        read_only: true
      - type: bind
        source: ${REPORTS_HOST_PATH:-./reports/generated}
        target: /reports

  # Opt-in Sprint 3 SPA service. frontend/Dockerfile is expected to build the
  # production assets and serve them with Nginx on port 80. Keeping this behind
  # a profile preserves the existing API-only development topology.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-drift-loan-frontend:local}
    restart: unless-stopped
    profiles: ["frontend"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  redis_data:
